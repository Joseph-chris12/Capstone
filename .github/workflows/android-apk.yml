name: Android APK

# Builds an installable APK so the app can be tested on a phone without a
# local Flutter/Android SDK. Download it from the run's "Artifacts" section.
#
# The app's Supabase URL and publishable key default to this project
# (lib/core/config.dart). Optional secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY
# override them, e.g. to point a build at another project.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          args=(--release)
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            args+=(--dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY")
          fi
          if [ -n "$SUPABASE_URL" ]; then
            args+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
          fi
          flutter build apk "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ar-gallery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
