name: Deploy AR test page

# Publishes docs/ to GitHub Pages. The camera API needs a secure context, so the
# page has to be served over HTTPS — Pages gives that for free, which is why the
# test page is hosted rather than opened from a file or a laptop on the cafe wifi.
# Only main. The github-pages environment refuses deploys from other branches,
# so a branch run could never publish -- and worse, with cancel-in-progress
# below it would cancel a real main deploy before dying itself. That is exactly
# what happened to run 8.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be enabled with Source = "GitHub Actions"
      # (Settings -> Pages). The workflow's GITHUB_TOKEN can deploy to an
      # existing Pages site but cannot create one -- `enablement: true` fails
      # with "Resource not accessible by integration", since creating the site
      # needs repo admin rights. It is a one-time manual step.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
